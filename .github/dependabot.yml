# Dependabot version updates are DISABLED here (open-pull-requests-limit: 0).
#
# Grouped weekly version-update PRs were tried and removed: the noise they were
# meant to fix was per-advisory alert email about transitive build-tooling
# packages (fast-uri, brace-expansion, glob, picomatch...), and this file does
# not control those. Alert emails are turned off per-account under
# GitHub Settings -> Notifications -> Dependabot alerts; outstanding alerts get
# reviewed in the repo's Security tab instead.
#
# Dependabot SECURITY updates are unaffected by this file and remain on -- they
# are a repository setting (Settings -> Code security), independent of the
# version-update config here. Only routine version bumps are suppressed.
#
# To re-enable version updates, set open-pull-requests-limit back to 3. The
# schedule and grouping below are kept so that flip stays a one-line change:
# they collapse a week's bumps into at most two PRs, one for production
# dependencies and one for dev/build tooling.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
